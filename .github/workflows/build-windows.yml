name: Build Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build Windows release
        working-directory: frontend
        run: flutter build windows --release

      - name: Build MSIX installer
        working-directory: frontend
        run: dart run msix:create

      - name: Create ZIP
        shell: pwsh
        run: |
          $src = "frontend\build\windows\x64\runner\Release"
          $zip = "FinancePro-${{ github.ref_name }}-Windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinancePro-Windows-${{ github.ref_name }}
          path: |
            FinancePro-${{ github.ref_name }}-Windows.zip
            frontend/build/windows/x64/runner/Release/financepro.msix

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FinancePro-${{ github.ref_name }}-Windows.zip
            frontend/build/windows/x64/runner/Release/financepro.msix
