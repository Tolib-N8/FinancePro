name: financepro
description: Personal finance tracking platform with AI
publish_to: 'none'
version: 1.2.0+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  flutter_hooks: ^0.20.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3

  # Data models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI / Charts
  fl_chart: ^0.68.0
  flex_color_scheme: ^8.0.0
  flutter_svg: ^2.0.10

  # File / Image
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.3

  # Security
  crypto: ^3.0.3

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  logger: ^2.3.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_lints: ^4.0.0
  msix: ^3.16.7

flutter:
  uses-material-design: true

msix_config:
  display_name: FinancePro
  publisher_display_name: Tolib
  identity_name: com.financepro.app
  msix_version: 1.2.0.0
  description: Personal finance tracking platform with AI
  capabilities: internetClient
  install_certificate: false
