[project]
name = "financepro-backend"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Validation & settings
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # AI
    "google-generativeai>=0.8",

    # File handling
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "pdf2image>=1.17",
    "Pillow>=10.0",

    # Utilities
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "watchfiles>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
